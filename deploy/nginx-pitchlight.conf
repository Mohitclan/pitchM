# For a server that already runs nginx on ports 80/443 (so Caddy can't be used).
# Replace YOUR_DOMAIN, save as /etc/nginx/sites-available/pitchlight, link it into sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR_DOMAIN        # adds the HTTPS server block and renews it automatically
# Other sites on this nginx are not touched.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    client_max_body_size 25m;           # slide PDFs (20 MB) and documents

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;          # live calls use a WebSocket (/ws)
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 7200s;                         # meetings can run up to 90 minutes
        proxy_send_timeout 7200s;
        proxy_buffering off;
    }
}
